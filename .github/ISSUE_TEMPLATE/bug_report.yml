name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start taskshed with ...
        2. curl ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `taskshed -version` or the image tag.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it
      options:
        - Release binary
        - Docker image
        - Docker Compose
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: db
    attributes:
      label: Database
      options:
        - SQLite
        - PostgreSQL
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines (set LOG_LEVEL=debug if useful). Remove secrets.
      render: json
